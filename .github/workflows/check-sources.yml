name: check-sources

on:
  pull_request:
    paths:
      - "sources.yml"
      - "docs/**"
      - "templates/**"
      - "README.md"
      - "CHANGELOG.md"
      - "scripts/check_sources.py"
      - ".github/workflows/check-sources.yml"
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC, before the 30-minute weekly scan in docs/monitoring.md.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate sources.yml, links and canonical repo names
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/check_sources.py --sleep 0.2 | tee check.log
      - name: Open an issue if the weekly run found drift
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('check.log') ? fs.readFileSync('check.log', 'utf8') : '(no log)';
            const title = `sources.yml drift detected ${new Date().toISOString().slice(0, 10)}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'sources-drift',
            });
            const body = [
              'The weekly `check-sources` run failed. Renamed, archived or missing repos and broken links are listed below.',
              '',
              '```',
              log.slice(-6000),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['sources-drift'],
              });
            }
