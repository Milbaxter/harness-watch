# Manual research bookmarks, not GitHub notification subscriptions or automations.
# Recheck state at visit time; closed does not imply merged.
participation_threads:
  - url: https://github.com/gepa-ai/gepa/issues/390
    note: Independent reproduction exposes incomplete candidates.
  - url: https://github.com/gepa-ai/gepa/pull/462
    note: Merged replacement fix; supersedes closed-unmerged PRs 435 and 460.
  - url: https://github.com/NousResearch/hermes-agent-self-evolution/pull/162
    note: Open proposal with several rounds of evaluation and boundary review.
  - url: https://github.com/NousResearch/hermes-agent-self-evolution/issues/186
    note: Skill discovery and routing as an evaluation gap.
  - url: https://github.com/NVlabs/SoL-Pi/pull/27
    note: Open reducer eligibility fix, with reproduction and contributor review history.
