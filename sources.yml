# Watchlist for the agent-harness ecosystem. Snapshot 2026-09-22.
# Intended as input to a weekly digest script (see docs/monitoring.md), or just as a bookmark list.
# layer: standard | runtime | config | curation | eval | infra | research

github_repos:
  # Layer 0: interop standards
  - repo: HarnessRouter/harnessrouter
    layer: standard
    watch: [releases]
    note: Reference implementation of the Unified Harness Protocol (UHP); one API over 10 harnesses.
  - repo: harnessprotocol/harness-protocol
    layer: standard
    watch: [releases, discussions]
    note: harness.yaml portable configuration spec. Different problem from UHP.
  - repo: harnessprotocol/harness-kit
    layer: standard
    watch: [releases]

  # Layer 1: runtimes (the three gravity wells)
  - repo: deepseek-ai/deepseek-harness
    layer: runtime
    watch: [releases, discussions]
    note: Everything-is-a-plugin on Cordis; minimal / PTC / creative profiles; developer preview with breaking changes.
  - repo: openclaw/openclaw
    layer: runtime
    watch: [releases]
    note: Harnesses (Claude, Codex, local) are swappable plugins behind a gateway. OpenClaw Foundation.
  - repo: openclaw/clawhub
    layer: config
    watch: [releases]
    note: Skill and plugin registry; also hosts whole-agent Claw packages.
  - repo: NousResearch/hermes-agent
    layer: runtime
    watch: [releases]
    note: Self-improving harness; skills hub over 11 registries.

  # Layer 1: coding-first runtimes
  - repo: earendil-works/pi
    layer: runtime
    watch: [releases, discussions]
    note: Formerly badlogic/pi-mono; npm scope @earendil-works. Minimal 4-tool harness; control arm in HarnessTax; SoL-Pi substrate.
  - repo: can1357/oh-my-pi
    layer: runtime
    watch: [releases]
    note: Fast-moving pi fork, coding-first.
  - repo: zai-org/ZCode
    layer: runtime
    watch: [releases]
    note: Z.ai's open coding-agent harness, released 2026-09-20.
  - repo: SWE-agent/mini-swe-agent
    layer: runtime
    watch: [releases]
    note: 100-line bash-only baseline; control arm for any comparison.
  - repo: SWE-agent/SWE-agent
    layer: runtime
    watch: [releases]
  - repo: OpenHands/OpenHands
    layer: runtime
    watch: [releases]
  - repo: anomalyco/opencode
    layer: runtime
    watch: [releases]
    note: Formerly sst/opencode; GitHub redirects the old path.
  - repo: aaif-goose/goose
    layer: runtime
    watch: [releases]
    note: Formerly block/goose; GitHub redirects the old path.
  - repo: langchain-ai/deepagents
    layer: runtime
    watch: [releases]
    note: Library, not CLI; included because it self-describes as an agent harness.
  - repo: context-labs/whip
    layer: runtime
    watch: [releases]
    note: Single-binary Go harness for open-weight models.

  # Layer 1: control planes / meta-harnesses
  - repo: loopx-project/loopx
    layer: runtime
    watch: [releases]
  - repo: AMAP-ML/LongHorizon-Harness
    layer: runtime
    watch: [releases]
  - repo: Q00/ouroboros
    layer: runtime
    watch: [releases]
    note: Budgeted evolution loop across 14 runtimes.

  # Layer 3: automated harness design (research code)
  - repo: NousResearch/hermes-agent-self-evolution
    layer: research
    watch: [pulls, commits]
    note: Dedicated skill-evolution pipeline; broader phases proposed in PR 162, not merged as of 2026-09-22. See participation field notes.
  - repo: gepa-ai/gepa
    layer: research
    watch: [releases, discussions, pulls]
    note: Trace-driven optimization of prompts, code and other text parameters; issue 390 and merged PR 462 form a useful experiment-to-fix history.
  - repo: stanfordnlp/dspy
    layer: research
    watch: [releases, discussions]
    note: GEPA integration and broader program optimization; follow relevant experiments, not every framework change.
  - repo: stanford-iris-lab/meta-harness
    layer: research
    watch: [releases, commits]
    note: Meta-Harness; outer-loop search over harness code; TB2 reference experiment.
  - repo: NVlabs/SoL-Pi
    layer: research
    watch: [releases, pulls]
    note: NVIDIA; auto-research-derived pi extension; benchmarks community PRs.
  - repo: TokenRhythm/NeoHorse
    layer: research
    watch: [commits]
  - repo: CosmosMind-ai/RSI-Harness
    layer: research
    watch: [commits]

  # Layer 3: eval infrastructure and benchmarks
  - repo: harbor-framework/harbor
    layer: infra
    watch: [releases]
    note: Runner behind Terminal-Bench; BaseAgent / BaseInstalledAgent for custom harnesses.
  - repo: harbor-framework/terminal-bench-2-1
    layer: eval
    watch: [releases, pulls]
    note: Watch for TB 3.x successor repo and submission-window changes.
  - repo: QoderAI/better-harness
    layer: infra
    watch: [releases]
    note: Session auditor over host transcripts (README 2026-09-22), not a trial runner.
  - repo: Qihoo360/harness-bench
    layer: eval
    watch: [releases]
    note: Fixed-model, vary-harness; 6 harnesses x 8 models x 106 tasks.
  - repo: TokenRhythm/claw-swe-bench
    layer: eval
    watch: [releases, pulls]
    note: Formerly opensquilla/claw-swe-bench (redirects). Adapters openclaw, hermes, nanobot, zeroclaw, generic.
  - repo: princeton-pli/hal-harness
    layer: infra
    watch: [releases]
    note: README says the repository is archived and the leaderboard is no longer updated through this harness.
  - repo: zli12321/LHTB
    layer: eval
    watch: [commits]
    note: Long-Horizon Terminal-Bench; segregates custom-harness runs.
  - repo: reacher-z/HarnessBench
    layer: eval
    watch: [commits]
  - repo: nyosegawa/harness-bench
    layer: eval
    watch: [commits]
  - repo: namanvats/scaffold-effects
    layer: eval
    watch: [commits]


  - repo: openai/codex
    layer: runtime
    watch: [releases]
    note: Apache-2.0 CLI. apply_patch; seatbelt / landlock / bubblewrap. Harbor installed agent.
  - repo: google-gemini/gemini-cli
    layer: runtime
    watch: [releases]
    note: Loop detection in source; headless JSON and JSONL. Harbor installed agent.
  - repo: OpenHands/software-agent-sdk
    layer: runtime
    watch: [releases]
    note: SDK harness (stuck detector, file_editor, condenser). Separate from the OpenHands app repo.
  - repo: PrimeIntellect-ai/prime-agent
    layer: runtime
    watch: [releases, discussions]
    note: RLM REPL and /refine over durable harness state. README says it is not a sandbox. No Harbor adapter as of 2026-09-22.
  - repo: skillsynchq/txcript
    layer: infra
    watch: [releases]
    note: Converts a live session among Claude Code, Codex and OpenCode. Continuation, not an eval trajectory.
  - repo: harbor-framework/terminal-bench
    layer: eval
    watch: [releases]
    note: Dataset README current as of 2026-09-22 is Terminal-Bench 4.0. Run tag terminal-bench/terminal-bench@latest, k=5.

  # Layer 3: curation
  - repo: ai-boost/awesome-harness-engineering
    layer: curation
    watch: [commits]
    note: Largest awesome-list for the topic.
  - repo: walkinglabs/learn-harness-engineering
    layer: curation
    watch: [releases]
    note: 12-lesson course, 14 languages.
  - repo: walkinglabs/awesome-harness-engineering
    layer: curation
    watch: [commits]
  - repo: RyanAlberts/best-of-Agent-Harnesses
    layer: curation
    watch: [commits]
    note: Ranked, rescored weekly, MCP server + llms.txt.
  - repo: cobusgreyling/loop-engineering
    layer: curation
    watch: [commits]
    note: Hub for the sibling term.
  - repo: nexu-io/harness-engineering-guide
    layer: curation
    watch: [discussions]
  - repo: Turi-Labs/awesome-harness
    layer: curation
    watch: [commits]
  - repo: Lijunjie2/awesome-agent-harness
    layer: curation
    watch: [commits]
  - repo: Picrew/awesome-agent-harness
    layer: curation
    watch: [commits]
  - repo: lobehub/awesome-rsi
    layer: curation
    watch: [commits]
  - repo: awesome-dsh-plugin/awesome-dsh-plugin
    layer: curation
    watch: [commits]
  - repo: Zhiyuan-Fan/Awesome-DeepSeek-Harness-Plugins
    layer: curation
    watch: [commits]
  - repo: Electricitysheep/dsh-handbook
    layer: curation
    watch: [commits]
    note: Includes same-model multi-agent comparisons on dsh.

  # Layer 2: config-layer hubs
  - repo: sadsfae/awesome-claude-code
    layer: config
    watch: [commits]
  - repo: Chat2AnyLLM/awesome-claude-plugins
    layer: config
    watch: [commits]
  - repo: sergeykrin9/awesome-claude-code-workflows
    layer: config
    watch: [commits]
  - repo: obra/superpowers
    layer: config
    watch: [releases]
    note: Most-installed cross-runtime skill pack.
  - repo: BioInfo/claudelicious
    layer: config
    watch: [commits]
  - repo: maxritter/pilot-shell
    layer: config
    watch: [releases]
  - repo: first-fluke/oh-my-agent
    layer: config
    watch: [releases]
  - repo: revfactory/harness
    layer: config
    watch: [releases]
  - repo: hgflima/harness-lab
    layer: config
    watch: [releases]
  - repo: madebywild/agent-harness
    layer: config
    watch: [releases]
  - repo: eooo-io/orkestr
    layer: config
    watch: [releases]

  # Layer 2: closed-CLI anatomy (primary sources on Claude Code's harness)
  - repo: Piebald-AI/claude-code-system-prompts
    layer: config
    watch: [commits]
    note: Updated within minutes of each Claude Code release; changelog across versions.
  - repo: whanyu1212/claude-code-anatomy
    layer: config
    watch: [commits]
  - repo: HaiDong-Once/claude-code-map
    layer: config
    watch: [commits]

github_topics:
  - harness-engineering
  - agent-harness
  - loop-engineering
  - dsh-plugin
  - cordis
  - pi-package
  - claude-code-plugin
  - coding-agent

# Topic tags are gamed. Always AND a description/README keyword with the topic,
# and drop repos whose description does not mention agent/harness/coding at all.
github_repo_searches:
  # append pushed:>YYYY-MM-DD for the last 7 days
  - 'topic:harness-engineering harness in:description'
  - 'topic:agent-harness harness in:description'
  - 'topic:loop-engineering agent in:description'
  - 'topic:dsh-plugin harness in:description'
  - 'topic:pi-package'
  - '"agent harness" in:description,readme stars:>20'
  - '"harness" "coding agent" in:readme created:>2026-06-01'
  - '"harness card" in:readme'
  - '"harness evolution" OR "meta-harness" OR "auto-research" harness in:readme'
  - '"unified harness protocol" OR uhp harness in:readme'

github_code_searches:
  - 'path:.claude/skills filename:SKILL.md'
  - 'filename:AGENTS.md "harness"'
  - 'path:.pi/ extension:ts'
  - 'path:.cursor/rules'
  - 'filename:harness.yaml "$schema" harnessprotocol'
  - 'filename:cordis.yml dsh'
  - '"BaseInstalledAgent" language:Python'
  - '"BaseClawAdapter" language:Python'

npm_keywords:
  - pi-package
  - harness-engineering
  - agent-harness
  - loop-engineering
  - dsh-plugin
  - claude-code-plugin

npm_packages:
  - '@earendil-works/pi-coding-agent'
  - '@oh-my-pi/pi-coding-agent'
  - '@deepseek-ai/dsh'

pypi_release_feeds:
  - https://pypi.org/rss/project/mini-swe-agent/releases.xml
  - https://pypi.org/rss/project/harbor/releases.xml
  - https://pypi.org/rss/project/openhands-sdk/releases.xml

arxiv_queries:
  - 'abs:"agent harness"'
  - 'abs:"harness" AND abs:"coding agent"'
  - 'abs:"scaffold" AND (abs:"SWE-bench" OR abs:"Terminal-Bench")'
  - 'abs:"harness card"'
  - 'abs:"fixed model" AND abs:"harness"'
  - 'abs:"harness evolution" OR abs:"meta-harness" OR abs:"harness optimization"'
  - 'abs:"harness tax"'

