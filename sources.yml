github_topics:
  - harness-engineering
  - agent-harness
  - pi-package
  - claude-code-plugin
  - coding-agent
  - dsh-plugin

github_repo_searches:
  # append pushed:>YYYY-MM-DD for the last 7 days
  - 'topic:harness-engineering'
  - 'topic:agent-harness'
  - 'topic:pi-package'
  - 'topic:dsh-plugin'
  - '"agent harness" in:description,readme stars:>20'
  - '"harness" "coding agent" in:readme created:>2026-01-01'
  - '"harness card" in:readme'

github_code_searches:
  - 'path:.claude/skills filename:SKILL.md'
  - 'filename:AGENTS.md "harness"'
  - 'path:.pi/ extension:ts'
  - 'path:.cursor/rules'
  - '"BaseInstalledAgent" language:Python'
  - '"BaseClawAdapter" language:Python'

npm_keywords:
  - pi-package
  - dsh-plugin
  - harness-engineering
  - agent-harness
  - claude-code-plugin

pypi_release_feeds:
  - https://pypi.org/rss/project/mini-swe-agent/releases.xml
  - https://pypi.org/rss/project/harbor/releases.xml
  - https://pypi.org/rss/project/openhands-sdk/releases.xml

arxiv_queries:
  - 'abs:"agent harness"'
  - 'abs:"harness" AND abs:"coding agent"'
  - 'abs:"scaffold" AND (abs:"SWE-bench" OR abs:"Terminal-Bench")'
  - 'abs:"harness card"'
  - 'abs:"fixed model" AND abs:"harness"'

arxiv_anchor_papers:
  # follow forward citations via Semantic Scholar
  - id: 2510.11977
    title: Holistic Agent Leaderboard (HAL)
  - id: 2605.23950
    title: Stop Comparing LLM Agents Without Disclosing the Harness
  - id: 2605.27922
    title: Harness-Bench
  - id: 2606.12344
    title: Claw-SWE-Bench
  - id: 2607.22585
    title: The Scaffold Effect in Coding Agents
  - id: 2609.20804
    title: An Empirical Study of Harness Design for Coding Agents

huggingface:
  datasets:
    - harborframework/terminal-bench-2.0
    - TokenRhythm/Claw-SWE-Bench
    - badlogicgames/pi-mono
  search_terms:
    - terminal-bench
    - swe-bench
    - agent-trajectories
    - pi-share-hf

leaderboards:
  - name: Terminal-Bench
    url: https://www.tbench.ai/leaderboard
    axis: vary model, harness disclosed per entry
  - name: Harness-Bench
    url: https://www.harness-bench.ai/leaderboard.html
    axis: fixed protocol, model x harness pairs
  - name: Claw-SWE-Bench
    url: https://claw-swe-bench.github.io/
    axis: harness as controlled variable on SWE-bench
  - name: HAL
    url: https://hal.cs.princeton.edu/
    axis: cost-aware; paused for new models
  - name: SWE-bench bash-only
    url: https://www.swebench.com/
    axis: fixed harness (mini-swe-agent), vary model

blogs_and_posts:
  - https://www.anthropic.com/engineering/infrastructure-noise
  - https://www.thedeepfeed.ai/posts/2026-06-22-how-much-is-the-harness-worth-measuring-agent-scaffolds/
  - https://harness-guide.com
  - https://www.tbench.ai/news

