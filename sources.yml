huggingface:
  datasets:
    - harborframework/terminal-bench-2.0
    - TokenRhythm/Claw-SWE-Bench
    - IntelligenceLab/Long-Horizon-Terminal-Bench
    - IntelligenceLab/LHTB-leaderboard
    - badlogicgames/pi-mono
  search_terms:
    - terminal-bench
    - swe-bench
    - agent-trajectories
    - pi-share-hf

leaderboards:
  - name: Terminal-Bench (official)
    url: https://www.tbench.ai/leaderboard
    axis: vary model, harness + version disclosed per entry
  - name: Terminal-Bench 2.1 on vals.ai
    url: https://www.vals.ai
    axis: fixed harness (Terminus 2), vary model
  - name: HarnessTax
    url: https://harnesstax.github.io/
    axis: fixed model, vary harness (Claude Code / Codex CLI / pi); one-off
  - name: Harness-Bench
    url: https://www.harness-bench.ai/leaderboard.html
    axis: fixed protocol, model x harness pairs
  - name: Claw-SWE-Bench
    url: https://claw-swe-bench.github.io/
    axis: harness as controlled variable on SWE-bench
  - name: LHTB
    url: https://zli12321.github.io/LHTB/leaderboard.html
    axis: harness column per row; custom harnesses segregated
  - name: HAL
    url: https://hal.cs.princeton.edu/
    axis: cost-aware; paused for new models, harness repo archived 2026-07
  - name: SWE-bench bash-only
    url: https://www.swebench.com/
    axis: fixed harness (mini-swe-agent), vary model

