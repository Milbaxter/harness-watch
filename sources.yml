# Watchlist for the agent-harness ecosystem. Snapshot 2026-09.
# Intended as input to a weekly digest script (see docs/monitoring.md), or just as a bookmark list.
# layer: runtime | config | curation | eval | infra

github_repos:
  # Layer 1: runtimes
  - repo: earendil-works/pi
    layer: runtime
    watch: [releases, discussions]
    note: Minimal self-extensible harness; pi packages; author publishes sessions to HF.
  - repo: can1357/oh-my-pi
    layer: runtime
    watch: [releases]
    note: Active coding-oriented pi fork; tool interfaces, memory, debugging and subagents.
  - repo: SWE-agent/mini-swe-agent
    layer: runtime
    watch: [releases]
    note: 100-line bash-only baseline; control arm for any comparison.
  - repo: SWE-agent/SWE-agent
    layer: runtime
    watch: [releases]
  - repo: OpenHands/OpenHands
    layer: runtime
    watch: [releases]
  - repo: anomalyco/opencode
    layer: runtime
    watch: [releases]
  - repo: aaif-goose/goose
    layer: runtime
    watch: [releases]

